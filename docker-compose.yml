services:
  mysql:
    image: mysql:8.0
    container_name: ems-mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: ems_smb
      MYSQL_USER: ems_user
      MYSQL_PASSWORD: ems_password
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - ems
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ems-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - ems

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ems-app
    restart: unless-stopped
    environment:
      APP_KEY: "base64:2/0Hqol/Io57tLaM6Ep4lOuR9taLqAFqhKL9Gl8tOe8="
      APP_URL: "http://localhost:8099"

      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ems_smb
      DB_USERNAME: ems_user
      DB_PASSWORD: ems_password

      REDIS_HOST: redis
      REDIS_PORT: 6379

      RUN_MIGRATION: "true"

    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

    networks:
      - ems

    command: >
      sh -c "
        [ -f .env ] || env | grep -E '^(APP_|DB_|REDIS_)' > .env;
        php-fpm -F
      "

    healthcheck:
      test:
        [
          "CMD",
          "php",
          "-r",
          "exit(@fsockopen('127.0.0.1',9000)?0:1);"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    image: nginx:alpine
    container_name: ems-web
    restart: unless-stopped
    ports:
      - "8099:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      app:
        condition: service_healthy
    networks:
      - ems

networks:
  ems:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
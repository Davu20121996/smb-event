services:
  mysql:
    image: mysql:8.0
    container_name: ems-mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: ems_smb
      MYSQL_USER: ems_user
      MYSQL_PASSWORD: ems_password
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - ems
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ems-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - ems

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ems-app
    restart: unless-stopped
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ems_smb
      DB_USERNAME: ems_user
      DB_PASSWORD: ems_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RUN_MIGRATION: "true"
      APP_URL: http://localhost:8099
    volumes:
      - ./:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - ems
    command: ["php-fpm", "-F"]

  web:
    image: nginx:alpine
    container_name: ems-web
    restart: unless-stopped
    ports:
      - "8099:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - ems

networks:
  ems:
    driver: bridge

volumes:
  mysql_data:
  redis_data: